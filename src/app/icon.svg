<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CrossW">
  <!--
    Иконка приложения. Next.js сам отдаёт этот файл как favicon.

    Мотив — фрагмент кроссвордной сетки: синий фон читается как блоки, белые
    клетки — как буквенные, и вместе они складываются в крест. Ничего мельче
    пяти клеток брать нельзя: на 16 пикселях детали сливаются.
  -->
  <rect width="32" height="32" rx="7" fill="#2563eb" />
  <g fill="#ffffff">
    <rect x="13" y="5" width="6" height="6" rx="1" />
    <rect x="5" y="13" width="6" height="6" rx="1" />
    <rect x="13" y="13" width="6" height="6" rx="1" />
    <rect x="21" y="13" width="6" height="6" rx="1" />
    <rect x="13" y="21" width="6" height="6" rx="1" />
  </g>
</svg>
